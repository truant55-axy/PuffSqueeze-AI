limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_zone $http_authorization zone=ai:10m rate=10r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 12m;
    limit_req_status 429;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /api/login {
        limit_req zone=auth burst=20 nodelay;
        include /etc/nginx/puffsqueeze-api.conf;
    }
    location = /api/register {
        limit_req zone=auth burst=20 nodelay;
        include /etc/nginx/puffsqueeze-api.conf;
    }
    location = /api/password/change {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/puffsqueeze-api.conf;
    }
    location ^~ /api/ai/ {
        limit_req zone=ai burst=3 nodelay;
        include /etc/nginx/puffsqueeze-api.conf;
    }
    location ^~ /api/ { include /etc/nginx/puffsqueeze-api.conf; }
    location ~ ^/(\.|backend/|src/|node_modules/|deploy/) { return 404; }
    location = /index.html { add_header Cache-Control "no-store" always; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
}
