name: puffsqueeze
services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [php]
  php:
    build: ../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_TIMEZONE: Asia/Shanghai
      DB_TIMEZONE: "+08:00"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-puffsqueeze}
      DB_USER: ${DB_USER:-puffsqueeze}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_SSL_MODE: disabled
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALLOWED_ORIGIN: ""
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-puffsqueeze}
      MARIADB_USER: ${DB_USER:-puffsqueeze}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  database_data:
  caddy_data:
  caddy_config:
