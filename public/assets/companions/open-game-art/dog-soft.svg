<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" fill="none">
  <defs>
    <linearGradient id="fur" x1="45" y1="40" x2="190" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5D8B8"/>
      <stop offset=".55" stop-color="#E9BC91"/>
      <stop offset="1" stop-color="#D79B73"/>
    </linearGradient>
    <linearGradient id="ear" x1="42" y1="62" x2="87" y2="176" gradientUnits="userSpaceOnUse">
