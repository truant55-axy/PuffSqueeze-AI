<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Aviator · PuffSqueeze</title>
  <link rel="stylesheet" href="./aviator.css">
  <script defer src="./js/three.min.js"></script>
  <script defer src="./js/controls.js"></script>
  <script defer src="./js/game.js?v=20261016-flight-2"></script>
</head>
<body>
  <div id="world" aria-label="海面、云朵与小飞机"></div>
  <header class="flight-hud" aria-label="飞行进度">
    <div class="flight-heading"><span class="eyebrow">PUFFSQUEEZE / THE AVIATOR</span><p data-i18n="tagline">把节奏，交给海风。</p></div>
    <div class="flight-stats">
      <div><span data-i18n="distance">航程</span><strong><b id="distValue">0</b><small>m</small></strong></div>
      <div><span data-i18n="level">旅程</span><strong id="levelValue">1</strong></div>
      <div><span data-i18n="collected">收集</span><strong id="collectedValue">0</strong></div>
      <button type="button" id="pauseButton" data-i18n="pause">暂停</button>
    </div>
    <div class="energy"><span data-i18n="energy">飞行能量</span><div class="energy-track" role="progressbar" aria-label="飞行能量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="energyMeter"><div id="energyBar"></div></div></div>
  </header>
  <section id="replayMessage" class="flight-overlay" aria-live="polite">
    <div class="flight-panel">
      <span class="eyebrow" id="overlayEyebrow">A LITTLE SEA ESCAPE</span>
      <h1 id="overlayTitle">沿着海风，轻轻出发</h1>
      <p id="overlayBody">小飞机会自动前行。收集青绿色能量，轻轻避开珊瑚红障碍。</p>
      <div class="control-pair"><span><kbd>←</kbd><b data-i18n="rise">上升</b></span><span><kbd>→</kbd><b data-i18n="descend">下降</b></span></div>
      <button type="button" id="startButton">开始飞行</button>
      <p class="panel-note" id="overlayHint">按任一方向键开始，无需空格键。</p>
    </div>
  </section>
  <footer class="flight-footer">
    <div class="flight-pad"><button type="button" id="riseButton" aria-label="按住左键上升"><kbd>←</kbd><span data-i18n="rise">上升</span></button><button type="button" id="descendButton" aria-label="按住右键下降"><kbd>→</kbd><span data-i18n="descend">下降</span></button></div>
    <div class="footer-copy"><p data-i18n="hold">按住移动 · 松开悬停</p><p data-i18n="both">双键一起按暂停 · 松开后按任一键继续</p></div>
    <a href="./CREDITS.md" target="_blank" rel="noopener" class="credits">Karim Maaloul / Codrops ↗</a>
  </footer>
  <svg hidden aria-hidden="true"><circle id="levelCircleStroke" /></svg>
</body>
</html>
